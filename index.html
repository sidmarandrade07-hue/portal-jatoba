<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Indicadores Jatobá</title>
    <style>
        /* Reset de margens e fontes */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background-color: #f4f4f9; }
        
        /* Menu Lateral (Sidebar) */
        #sidebar { width: 260px; background-color: #0b132b; color: white; transition: width 0.3s; display: flex; flex-direction: column; white-space: nowrap; }
        #sidebar.hidden { width: 0; overflow: hidden; }
        .logo-area { padding: 20px; font-size: 1.3rem; font-weight: bold; text-align: center; border-bottom: 1px solid #1c2541; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .menu-links { list-style: none; padding-top: 10px; flex-grow: 1; }
        .menu-links li { padding: 15px 20px; cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; font-size: 0.95rem; }
        .menu-links li:hover { background-color: #1c2541; }
        .menu-links li.active { background-color: #1c2541; border-left-color: #e5383b; font-weight: bold; } 
        
        /* Área Principal */
        #main-content { flex-grow: 1; display: flex; flex-direction: column; width: calc(100% - 260px); transition: width 0.3s; }
        #sidebar.hidden ~ #main-content { width: 100%; }
        
        /* Barra Superior */
        #topbar { background-color: white; height: 60px; display: flex; align-items: center; padding: 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); z-index: 10; justify-content: space-between; }
        #hamburger { font-size: 1.5rem; cursor: pointer; background: none; border: none; color: #333; padding: 5px; }
        .topbar-title { font-weight: 600; color: #333; font-size: 1.1rem; }
        
        /* ======================================================== */
        /* COMPORTAMENTO PADRÃO DO IFRAME (Para GitHub e outros)  */
        /* ======================================================== */
        #iframe-container { 
            flex-grow: 1; 
            width: 100%; 
            height: calc(100vh - 60px); 
            display: flex;
            justify-content: center; 
            align-items: center; 
            background-color: #f4f4f9; 
            overflow: hidden; 
            padding: 0; /* Sem margens, ocupa tudo */
            transition: padding-left 0.3s ease; 
        }
        
        iframe { 
            width: 100%; 
            height: 100%; /* Ocupa 100% sem restrição de aspect-ratio */
            border: none; 
            display: block; 
        }

        /* ======================================================== */
        /* COMPORTAMENTO ESPECÍFICO PARA POWER BI                   */
        /* ======================================================== */
        #iframe-container.powerbi-mode {
            justify-content: flex-start; 
            align-items: flex-start; 
            padding-top: 5px; 
            padding-left: 80px; 
        }
        
        #sidebar.hidden ~ #main-content #iframe-container.powerbi-mode {
            padding-left: 170px; 
        }

        #iframe-container.powerbi-mode iframe { 
            height: calc(100% - 10px); 
            width: auto; /* Remove os 100% de largura padrão */
            aspect-ratio: 16 / 9; /* Aplica a trava matemática */
        }
        
        /* Responsividade para Celulares */
        @media (max-width: 768px) {
            #sidebar { position: absolute; height: 100%; z-index: 20; width: 260px; left: -260px; transition: left 0.3s; }
            #sidebar.active-mobile { left: 0; }
            #main-content { width: 100%; }
            
            #iframe-container.powerbi-mode { padding-left: 10px; padding-right: 10px; justify-content: center; }
            #sidebar.hidden ~ #main-content #iframe-container.powerbi-mode { padding-left: 10px; }
            #iframe-container.powerbi-mode iframe { width: 100%; height: auto; }
        }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <nav id="sidebar">
        <div class="logo-area">
            Portal Jatobá
        </div>
        <ul class="menu-links">
            <li onclick="loadPage('https://app.powerbi.com/view?r=eyJrIjoiNjhjN2E4ZmYtNGMxNS00YWUxLTg1ZjItZThmMzY4NmQ4MmEwIiwidCI6ImY5NTEyNWRkLTcwYzktNDdkNC1hOTgzLWMyYjM1ZDkxYTI0ZSJ9&navContentPaneEnabled=false', this)" class="active">Indicador Compras</li>
            <li onclick="loadPage('https://sidmarandrade07-hue.github.io/painel-plantio-jatoba/', this)">Qualidade Plantio</li>
            <li onclick="loadPage('https://sidmarandrade07-hue.github.io/Novilhas-Precoce-2026/', this)">Precoce 2026</li>
           
        </ul>
    </nav>

    <!-- Conteúdo Principal -->
    <main id="main-content">
        <header id="topbar">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button id="hamburger" onclick="toggleMenu()">☰</button>
                <span class="topbar-title" id="titulo-pagina">Indicador Compras</span>
            </div>
        </header>
        
        <!-- A classe powerbi-mode já vem ativada no primeiro carregamento -->
        <div id="iframe-container" class="powerbi-mode">
            <iframe id="content-frame" src="https://app.powerbi.com/view?r=eyJrIjoiNjhjN2E4ZmYtNGMxNS00YWUxLTg1ZjItZThmMzY4NmQ4MmEwIiwidCI6ImY5NTEyNWRkLTcwYzktNDdkNC1hOTgzLWMyYjM1ZDkxYTI0ZSJ9&navContentPaneEnabled=false" title="Dashboard"></iframe>
        </div>
    </main>

    <!-- Lógica de Funcionamento -->
    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('active-mobile');
            } else {
                sidebar.classList.toggle('hidden');
            }
        }

        function loadPage(url, element) {
            const container = document.getElementById('iframe-container');
            
            // Verifica de forma automática se o link é do Power BI
            if (url.includes('powerbi.com')) {
                container.classList.add('powerbi-mode'); // Ativa as margens e a trava de proporção
            } else {
                container.classList.remove('powerbi-mode'); // Libera 100% da tela para o GitHub
            }

            document.getElementById('content-frame').src = url;
            document.getElementById('titulo-pagina').innerText = element.innerText;
            
            const links = document.querySelectorAll('.menu-links li');
            links.forEach(link => link.classList.remove('active'));
            element.classList.add('active');

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('active-mobile');
            }
        }
    </script>
</body>
</html>
